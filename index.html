<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>flag of the day</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      background: #fff;
      color: #111;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }

    #count {
      color: #888;
      font-size: 14px;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ddd;
      outline: none;
      margin-bottom: 24px;
      box-sizing: border-box;
    }

    input:focus { border-color: #111; }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .row.hidden { display: none; }

    .day {
      color: #aaa;
      font-size: 12px;
      min-width: 48px;
    }

    .flag-thumb {
      width: 28px;
      height: 20px;
      object-fit: cover;
      border: 1px solid #eee;
      flex-shrink: 0;
      background: #f7f7f7;
    }

    .row a {
      color: #111;
      font-size: 15px;
    }

    .row a:hover { color: #0066cc; }

    .alt {
      font-size: 12px;
      color: #888;
    }

    .alt a { color: #888; font-size: 12px; }
    .alt a:hover { color: #0066cc; }
  </style>
</head>
<body>
  <h1>flag of the day</h1>
  <div id="count"></div>
  <input type="text" id="search" placeholder="search…" autocomplete="off"/>
  <div id="list"></div>

  <script>
    // fetch() with a couple of retries — smooths over transient network hiccups
    // rather than treating a single failed request as "no image".
    async function fetchWithRetry(url, retries = 2, delayMs = 400) {
      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          const res = await fetch(url);
          if (res.ok) return res;
        } catch (e) {
          // fall through to retry
        }
        if (attempt < retries) await new Promise(r => setTimeout(r, delayMs * (attempt + 1)));
      }
      return null;
    }

    // Resolve MANY titles against a single MediaWiki API endpoint in one
    // request (chunked at 50 titles, the anonymous API limit), instead of
    // firing one fetch per flag. This is both faster and far more reliable —
    // hundreds of simultaneous individual requests get throttled/dropped by
    // Wikimedia/Fandom, which is what was causing icons to load
    // inconsistently between refreshes.
    async function batchResolveTitles(apiBase, titles, isFile, width) {
      const results = new Map(); // title -> url|null
      const chunkSize = 50;

      for (let i = 0; i < titles.length; i += chunkSize) {
        const chunk = titles.slice(i, i + chunkSize);
        const params = isFile
          ? `prop=imageinfo&iiprop=url&iiurlwidth=${width}`
          : `prop=pageimages&piprop=thumbnail&pithumbsize=${width}`;
        const endpoint = `${apiBase}?action=query&redirects=1&titles=${encodeURIComponent(chunk.join('|'))}&${params}&format=json&origin=*`;

        const res = await fetchWithRetry(endpoint);
        if (!res) { chunk.forEach(t => results.set(t, null)); continue; }

        try {
          const data = await res.json();
          const q = data.query || {};
          const pagesByTitle = {};
          for (const pid in (q.pages || {})) {
            pagesByTitle[q.pages[pid].title] = q.pages[pid];
          }
          // A title can be renamed via normalization and/or a redirect
          // before landing on its final page entry — follow both chains.
          const resolveFinalTitle = (t) => {
            let cur = t;
            const norm = (q.normalized || []).find(x => x.from === cur);
            if (norm) cur = norm.to;
            const redir = (q.redirects || []).find(x => x.from === cur);
            if (redir) cur = redir.to;
            return cur;
          };

          chunk.forEach(t => {
            const page = pagesByTitle[resolveFinalTitle(t)];
            if (!page || page.missing !== undefined) { results.set(t, null); return; }
            if (isFile) {
              const info = page.imageinfo && page.imageinfo[0];
              results.set(t, (info && (info.thumburl || info.url)) || null);
            } else {
              results.set(t, (page.thumbnail && page.thumbnail.source) || null);
            }
          });
        } catch (e) {
          chunk.forEach(t => results.set(t, null));
        }
      }

      return results;
    }

    (async () => {
      const listRes = await fetchWithRetry('FOTD.html');
      const html = listRes ? await listRes.text() : '';
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const rows = [...doc.querySelectorAll('tr')];
      const list = document.getElementById('list');
      let count = 0;

      // First pass: render every row (with an empty thumbnail placeholder)
      // and classify its flag link so we know how to resolve it.
      const descriptors = []; // { thumbEl, mainHref }

      rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        if (!cells.length) return;
        const dayText = cells[0].textContent.trim();
        if (!dayText.match(/^Day \d+$/i)) return;

        const mainLink = cells[1]?.querySelector('a');
        if (!mainLink) return;

        const mainHref = mainLink.getAttribute('href');
        const altLink = cells[2]?.querySelector('a');
        const altHref = altLink?.getAttribute('href');

        const div = document.createElement('div');
        div.className = 'row';
        div.dataset.name = mainLink.textContent.toLowerCase();
        div.dataset.day = dayText.toLowerCase();

        div.innerHTML = `
          <span class="day">${dayText.replace('Day ', '#')}</span>
          <a href="${mainHref}" target="_blank">${mainLink.textContent}</a>
          <img class="flag-thumb" alt="" loading="lazy" />
          ${altHref ? `<span class="alt">— <a href="${altHref}" target="_blank">alt</a></span>` : ''}
        `;

        list.appendChild(div);

        const dayMatch = dayText.match(/^Day (\d+)$/i);
        const dayNum = dayMatch ? parseInt(dayMatch[1], 10) : -1;

        const thumbEl = div.querySelector('.flag-thumb');
        thumbEl.addEventListener('error', () => thumbEl.remove());

        descriptors.push({ thumbEl, mainHref, dayNum });
        count++;
      });

      document.getElementById('count').textContent = `${count} flags. ${count} days.`;

      // Second pass: classify each link and group the MediaWiki ones by
      // (api endpoint, isFile) so each group can be resolved in one batch.
      const groups = new Map(); // key -> { apiBase, isFile, rowsByTitle: Map(title -> descriptor[]) }
      const commonsFallbackTitles = new Map(); // title -> descriptor[]

      for (const d of descriptors) {
        let url;
        try { url = new URL(d.mainHref); } catch (e) { d.thumbEl.remove(); continue; }

        // Google Drive share links don't need an API call at all.
        if (url.hostname.includes('drive.google.com')) {
          const m = d.mainHref.match(/\/file\/d\/([^/]+)/);
          if (m) {
            d.thumbEl.src = `https://drive.google.com/thumbnail?id=${m[1]}&sz=w60`;
          } else {
            d.thumbEl.remove();
          }
          continue;
        }

        const wikiMatch = d.mainHref.match(/\/wiki\/([^#?]+)/);
        if (wikiMatch) {
          let title = decodeURIComponent(wikiMatch[1]);

          // Some Fandom links point at an article with a `?file=` query
          // param instead of the File: page itself.
          const fileParam = url.searchParams.get('file');
          if (fileParam) title = 'File:' + fileParam;

          const isFile = /^File:/i.test(title);
          const host = url.hostname;

          let apiBase;
          if (/wikimedia\.org$/.test(host) || /wikipedia\.org$/.test(host)) {
            apiBase = `${url.protocol}//${host.replace(/^commons\.m\./, 'commons.')}/w/api.php`;
          } else if (/fandom\.com$/.test(host)) {
            apiBase = `${url.protocol}//${host}/api.php`;
          } else {
            // Rare: some other self-hosted wiki. Best-effort guess.
            apiBase = `${url.protocol}//${host}/w/api.php`;
          }

          const key = apiBase + '|' + (isFile ? 'file' : 'page');
          if (!groups.has(key)) groups.set(key, { apiBase, isFile, rowsByTitle: new Map() });
          const g = groups.get(key);
          if (!g.rowsByTitle.has(title)) g.rowsByTitle.set(title, []);
          g.rowsByTitle.get(title).push(d);

          // Flags are often uploaded straight to Commons even when linked
          // from a different wiki — queue a Commons fallback for File: links.
          if (isFile && !/wikimedia\.org$/.test(host)) {
            if (!commonsFallbackTitles.has(title)) commonsFallbackTitles.set(title, []);
            commonsFallbackTitles.get(title).push(d);
          }
          continue;
        }

        // The link itself points straight at an image file.
        if (/\.(png|jpe?g|gif|svg|webp)$/i.test(url.pathname)) {
          d.thumbEl.src = d.mainHref;
          continue;
        }

        d.thumbEl.remove();
      }

      // Resolve every group concurrently, each as a small number of batched
      // requests instead of one request per row.
      await Promise.all([...groups.values()].map(async g => {
        const titles = [...g.rowsByTitle.keys()];
        const resolved = await batchResolveTitles(g.apiBase, titles, g.isFile, 60);
        for (const [title, descs] of g.rowsByTitle) {
          const url = resolved.get(title);
          if (url) {
            descs.forEach(d => { d.thumbEl.src = url; d.resolved = true; });
          }
        }
      }));

      // Fallback pass: retry any still-unresolved File: links against Commons.
      const stillUnresolved = [...commonsFallbackTitles.keys()].filter(title =>
        commonsFallbackTitles.get(title).some(d => !d.resolved)
      );
      if (stillUnresolved.length) {
        const fb = await batchResolveTitles('https://commons.wikimedia.org/w/api.php', stillUnresolved, true, 60);
        stillUnresolved.forEach(title => {
          const url = fb.get(title);
          if (!url) return;
          commonsFallbackTitles.get(title).forEach(d => {
            if (!d.resolved) { d.thumbEl.src = url; d.resolved = true; }
          });
        });
      }

      // Clean up any rows that never got resolved.
      descriptors.forEach(d => { if (!d.thumbEl.src) d.thumbEl.remove(); });

      // Favicon = the flag with the highest day number that actually
      // resolved to an image (not just whichever happened to finish last).
      const resolvedDescriptors = descriptors.filter(d => d.thumbEl.src);
      if (resolvedDescriptors.length) {
        const latest = resolvedDescriptors.reduce((max, d) => (d.dayNum > max.dayNum ? d : max), resolvedDescriptors[0]);
        const link = document.createElement('link');
        link.rel = 'icon';
        link.href = latest.thumbEl.src;
        document.head.appendChild(link);
      }

      document.getElementById('search').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        document.querySelectorAll('.row').forEach(row => {
          row.classList.toggle('hidden', q && !row.dataset.name.includes(q) && !row.dataset.day.includes(q));
        });
      });
    })();
  </script>
</body>
</html>
