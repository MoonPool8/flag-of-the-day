<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>flag of the day</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      background: #fff;
      color: #111;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }

    #count {
      color: #888;
      font-size: 14px;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ddd;
      outline: none;
      margin-bottom: 24px;
      box-sizing: border-box;
    }

    input:focus { border-color: #111; }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .row.hidden { display: none; }

    .day {
      color: #aaa;
      font-size: 12px;
      min-width: 48px;
    }

    .flag-thumb {
      width: 28px;
      height: 20px;
      object-fit: cover;
      border: 1px solid #eee;
      flex-shrink: 0;
      background: #f7f7f7;
    }

    .row a {
      color: #111;
      font-size: 15px;
    }

    .row a:hover { color: #0066cc; }

    .alt {
      font-size: 12px;
      color: #888;
    }

    .alt a { color: #888; font-size: 12px; }
    .alt a:hover { color: #0066cc; }
  </style>
</head>
<body>
  <h1>flag of the day</h1>
  <div id="count"></div>
  <input type="text" id="search" placeholder="search…" autocomplete="off"/>
  <div id="list"></div>

  <script>
    // Query a single MediaWiki-style API endpoint for a title.
    // isFile=true looks up the file itself (imageinfo); otherwise looks up
    // the page's lead/infobox image (pageimages).
    async function tryMediaWikiApi(apiBase, title, isFile, width) {
      try {
        const params = isFile
          ? `prop=imageinfo&iiprop=url&iiurlwidth=${width}`
          : `prop=pageimages&piprop=thumbnail&pithumbsize=${width}`;
        const endpoint = `${apiBase}?action=query&redirects=1&titles=${encodeURIComponent(title)}&${params}&format=json&origin=*`;
        const res = await fetch(endpoint);
        if (!res.ok) return null;
        const data = await res.json();
        const pages = data.query && data.query.pages;
        if (!pages) return null;
        const page = pages[Object.keys(pages)[0]];
        if (!page || page.missing !== undefined) return null;
        if (isFile) {
          const info = page.imageinfo && page.imageinfo[0];
          return (info && (info.thumburl || info.url)) || null;
        }
        return (page.thumbnail && page.thumbnail.source) || null;
      } catch (e) {
        return null;
      }
    }

    // Look up a usable thumbnail/image URL for a flag link. Links in the
    // data point to Wikimedia Commons, English Wikipedia, various Fandom
    // wikis, other self-hosted MediaWiki sites, and Google Drive share
    // links — this tries each source's own API rather than assuming Commons.
    async function getFlagImageUrl(pageUrl, width = 60) {
      try {
        const url = new URL(pageUrl);

        // Google Drive share links: https://drive.google.com/file/d/<ID>/view...
        if (url.hostname.includes('drive.google.com')) {
          const m = pageUrl.match(/\/file\/d\/([^/]+)/);
          return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w${width}` : null;
        }

        // Generic MediaWiki-style link: https://<host>/wiki/<Title>
        const wikiMatch = pageUrl.match(/\/wiki\/([^#?]+)/);
        if (wikiMatch) {
          let title = decodeURIComponent(wikiMatch[1]);

          // Some Fandom links point at an article with a `?file=` query
          // param instead of the File: page itself, e.g.
          // https://gender.fandom.com/wiki/Genderfaun?file=Foo.jpeg
          const fileParam = url.searchParams.get('file');
          if (fileParam) title = 'File:' + fileParam;

          const isFile = /^File:/i.test(title);
          const host = url.hostname;

          const apiCandidates = [];
          if (/wikimedia\.org$/.test(host) || /wikipedia\.org$/.test(host)) {
            apiCandidates.push(`${url.protocol}//${host.replace(/^commons\.m\./, 'commons.')}/w/api.php`);
          } else if (/fandom\.com$/.test(host)) {
            apiCandidates.push(`${url.protocol}//${host}/api.php`);
          } else {
            // Unknown wiki software — try both common endpoint locations.
            apiCandidates.push(`${url.protocol}//${host}/w/api.php`);
            apiCandidates.push(`${url.protocol}//${host}/api.php`);
          }

          for (const api of apiCandidates) {
            const result = await tryMediaWikiApi(api, title, isFile, width);
            if (result) return result;
          }

          // Flag files are often uploaded straight to Commons even when
          // linked from a non-Commons wiki page — try that as a last resort.
          if (isFile && !/wikimedia\.org$/.test(host)) {
            const result = await tryMediaWikiApi('https://commons.wikimedia.org/w/api.php', title, true, width);
            if (result) return result;
          }
        }

        // Fallback: the link itself points straight at an image file.
        if (/\.(png|jpe?g|gif|svg|webp)$/i.test(url.pathname)) {
          return pageUrl;
        }

        return null;
      } catch (e) {
        return null;
      }
    }

    async function setFaviconFromWikimedia(pageUrl) {
      try {
        const imageUrl = await getFlagImageUrl(pageUrl, 64);
        if (!imageUrl) return;

        const link = document.createElement('link');
        link.rel = 'icon';
        link.href = imageUrl;
        document.head.appendChild(link);
      } catch (e) {
        // Silently fail — no favicon is fine
      }
    }

    (async () => {
      const res = await fetch('FOTD.html');
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const rows = [...doc.querySelectorAll('tr')];
      const list = document.getElementById('list');
      let count = 0;
      let lastUrl = null;

      rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        if (!cells.length) return;
        const dayText = cells[0].textContent.trim();
        if (!dayText.match(/^Day \d+$/i)) return;

        const mainLink = cells[1]?.querySelector('a');
        if (!mainLink) return;

        const mainHref = mainLink.getAttribute('href');
        const altLink = cells[2]?.querySelector('a');
        const altHref = altLink?.getAttribute('href');

        const div = document.createElement('div');
        div.className = 'row';
        div.dataset.name = mainLink.textContent.toLowerCase();
        div.dataset.day = dayText.toLowerCase();

        div.innerHTML = `
          <span class="day">${dayText.replace('Day ', '#')}</span>
          <a href="${mainHref}" target="_blank">${mainLink.textContent}</a>
          <img class="flag-thumb" alt="" loading="lazy" />
          ${altHref ? `<span class="alt">— <a href="${altHref}" target="_blank">alt</a></span>` : ''}
        `;

        list.appendChild(div);

        // Fill in the thumbnail once we've looked up its real URL.
        const thumbEl = div.querySelector('.flag-thumb');
        thumbEl.addEventListener('error', () => thumbEl.remove());
        getFlagImageUrl(mainHref, 60).then(url => {
          if (url) {
            thumbEl.src = url;
          } else {
            thumbEl.remove();
          }
        });

        lastUrl = mainHref;
        count++;
      });

      document.getElementById('count').textContent = `${count} flags. ${count} days.`;

      if (lastUrl && lastUrl.includes('wikimedia.org')) {
        setFaviconFromWikimedia(lastUrl);
      }

      document.getElementById('search').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        document.querySelectorAll('.row').forEach(row => {
          row.classList.toggle('hidden', q && !row.dataset.name.includes(q) && !row.dataset.day.includes(q));
        });
      });
    })();
  </script>
</body>
</html>
