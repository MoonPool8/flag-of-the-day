<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>flag of the day</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      background: #fff;
      color: #111;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }

    #count {
      color: #888;
      font-size: 14px;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ddd;
      outline: none;
      margin-bottom: 24px;
      box-sizing: border-box;
    }

    input:focus { border-color: #111; }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .row.hidden { display: none; }

    .day {
      color: #aaa;
      font-size: 12px;
      min-width: 48px;
    }

    .flag-thumb {
      width: 28px;
      height: 20px;
      object-fit: cover;
      border: 1px solid #eee;
      flex-shrink: 0;
      background: #f7f7f7;
    }

    .row a {
      color: #111;
      font-size: 15px;
    }

    .row a:hover { color: #0066cc; }

    .alt {
      font-size: 12px;
      color: #888;
    }

    .alt a { color: #888; font-size: 12px; }
    .alt a:hover { color: #0066cc; }

    /* detail page styles */
    .detail { max-width: 900px; margin: 20px auto; }
    .detail .controls { margin-bottom: 12px; }
    .btn { padding: .4rem .7rem; margin-right: .4rem; cursor: pointer; }
    .flag-large { width: 100%; max-height: 60vh; object-fit: contain; border: 1px solid #eee; background: #fff; }
    .desc { margin-top: 12px; }
    .edit-area { width: 100%; min-height: 120px; font-size: 1rem; padding: .5rem; box-sizing: border-box; }
    .small { font-size: .9rem; color: #666; margin-top: .5rem; }
  </style>
</head>
<body>
  <div>
    <h1 style="color: red;">THANKS FOR 2 YEARS OF FLAG OF THE DAY!!</h1>
  </div>
  <h1>flag of the day</h1>
  <div id="count"></div>
  <input type="text" id="search" placeholder="search…" autocomplete="off"/>
  <div id="list"></div>

  <script>
    // fetch() with a couple of retries — smooths over transient network hiccups
    // rather than treating a single failed request as "no image".
    async function fetchWithRetry(url, retries = 2, delayMs = 400) {
      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          const res = await fetch(url);
          if (res.ok) return res;
        } catch (e) {
          // fall through to retry
        }
        if (attempt < retries) await new Promise(r => setTimeout(r, delayMs * (attempt + 1)));
      }
      return null;
    }

    // Resolve MANY titles against a single MediaWiki API endpoint in one
    // request (chunked at 50 titles, the anonymous API limit), instead of
    // firing one fetch per flag. This is both faster and far more reliable —
    // hundreds of simultaneous individual requests get throttled/dropped by
    // Wikimedia/Fandom, which is what was causing icons to load
    // inconsistently between refreshes.
    async function batchResolveTitles(apiBase, titles, isFile, width) {
      const results = new Map(); // title -> url|null
      const chunkSize = 50;

      for (let i = 0; i < titles.length; i += chunkSize) {
        const chunk = titles.slice(i, i + chunkSize);
        const params = isFile
          ? `prop=imageinfo&iiprop=url&iiurlwidth=${width}`
          : `prop=pageimages&piprop=thumbnail&pithumbsize=${width}`;
        const endpoint = `${apiBase}?action=query&redirects=1&titles=${encodeURIComponent(chunk.join('|'))}&${params}&format=json&origin=*`;

        const res = await fetchWithRetry(endpoint);
        if (!res) { chunk.forEach(t => results.set(t, null)); continue; }

        try {
          const data = await res.json();
          const q = data.query || {};
          const pagesByTitle = {};
          for (const pid in (q.pages || {})) {
            pagesByTitle[q.pages[pid].title] = q.pages[pid];
          }
          // A title can be renamed via normalization and/or a redirect
          // before landing on its final page entry — follow both chains.
          const resolveFinalTitle = (t) => {
            let cur = t;
            const norm = (q.normalized || []).find(x => x.from === cur);
            if (norm) cur = norm.to;
            const redir = (q.redirects || []).find(x => x.from === cur);
            if (redir) cur = redir.to;
            return cur;
          };

          chunk.forEach(t => {
            const page = pagesByTitle[resolveFinalTitle(t)];
            if (!page || page.missing !== undefined) { results.set(t, null); return; }
            if (isFile) {
              const info = page.imageinfo && page.imageinfo[0];
              results.set(t, (info && (info.thumburl || info.url)) || null);
            } else {
              results.set(t, (page.thumbnail && page.thumbnail.source) || null);
            }
          });
        } catch (e) {
          chunk.forEach(t => results.set(t, null));
        }
      }

      return results;
    }

    (async () => {
      const listRes = await fetchWithRetry('FOTD.html');
      const html = listRes ? await listRes.text() : '';
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const rows = [...doc.querySelectorAll('tr')];
      const list = document.getElementById('list');
      let count = 0;

      // If a detail view is requested via ?flag=<encodedHref>, render a
      // detail page inside this same file. This lets you update only index.html.
      const flagParam = new URLSearchParams(location.search).get('flag');
      if (flagParam) {
        const targetHref = decodeURIComponent(flagParam);
        // find the first matching row by comparing the original href in the
        // parsed FOTD.html (no normalization) so we can extract title/link.
        const matchRow = rows.find(row => {
          const cells = row.querySelectorAll('td');
          if (!cells.length) return false;
          const mainLink = cells[1]?.querySelector('a');
          if (!mainLink) return false;
          return mainLink.getAttribute('href') === targetHref;
        });

        if (!matchRow) {
          list.innerHTML = `<p>Flag not found.</p><p><a href="${location.pathname}">Back to list</a></p>`;
          return;
        }

        const cells = matchRow.querySelectorAll('td');
        const dayText = cells[0].textContent.trim();
        const mainLinkEl = cells[1]?.querySelector('a');
        const mainHref = mainLinkEl.getAttribute('href');
        const titleText = mainLinkEl.textContent.trim();
        const altLink = cells[2]?.querySelector('a');
        const altHref = altLink?.getAttribute('href');

        // Render detail UI
        const container = document.createElement('div');
        container.className = 'detail';
        container.innerHTML = `
          <div class="controls">
            <button id="backBtn" class="btn">◀ Back</button>
            <button id="editToggle" class="btn">Edit description</button>
            <button id="saveBtn" class="btn" style="display:none">Save</button>
            <button id="resetBtn" class="btn" style="display:none">Reset</button>
          </div>
          <main>
            <h2 id="title"><a id="titleLink" href="#" target="_blank" rel="noopener"></a></h2>
            <div><img id="flagImage" class="flag-large" alt="${escapeHtml(titleText)}"/></div>
            <div class="desc">
              <div id="descView"></div>
              <textarea id="descEdit" class="edit-area" style="display:none"></textarea>
              <div class="small">Title opens the source in a new tab. Your edits are saved locally to this browser (localStorage).</div>
            </div>
            <div style="margin-top:12px;" class="alt">${altHref ? 'Alt: <a href="' + escapeHtml(altHref) + '" target="_blank" rel="noopener">alt link</a>' : ''}</div>
          </main>
        `;

        document.getElementById('list').appendChild(container);

        const backBtn = document.getElementById('backBtn');
        backBtn.addEventListener('click', () => {
          if (history.length > 1) history.back();
          else location.href = location.pathname; // fallback to the list
        });

        const titleLink = document.getElementById('titleLink');
        titleLink.textContent = titleText;
        // Keep the original mainHref as the external link target. If it's
        // relative, make it absolute relative to the site root so the link
        // opens correctly in a new tab.
        try {
          const resolved = new URL(mainHref, location.href).href;
          titleLink.href = resolved;
        } catch (e) {
          titleLink.href = mainHref;
        }

        const flagImage = document.getElementById('flagImage');
        const descView = document.getElementById('descView');
        const descEdit = document.getElementById('descEdit');
        const editToggle = document.getElementById('editToggle');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');

        const STORAGE_KEY = 'fotd_descriptions_v1';
        function getSaved() {
          try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) { return {}; }
        }
        function saveAll(obj) { localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); }

        // Use same batch resolution method as list view for consistency and reliability
        (async function resolveImage() {
          // direct image URL
          try {
            const u = new URL(mainHref, location.href);
            if (/\.(png|jpe?g|gif|svg|webp)$/i.test(u.pathname)) {
              flagImage.src = u.href;
              return;
            }
          } catch (e) {
            // continue to wiki resolution
          }

          const wikiMatch = mainHref.match(/\/wiki\/([^#?]+)/);
          if (wikiMatch) {
            let title = decodeURIComponent(wikiMatch[1]);
            const url = new URL(mainHref, location.href);
            const fileParam = url.searchParams.get('file');
            if (fileParam) title = 'File:' + fileParam;
            const isFile = /^File:/i.test(title);
            const host = url.hostname;
            let apiBase;
            if (/wikimedia\.org$/.test(host) || /wikipedia\.org$/.test(host)) {
              apiBase = `${url.protocol}//${host.replace(/^commons\.m\./, 'commons.')}/w/api.php`;
            } else if (/fandom\.com$/.test(host)) {
              apiBase = `${url.protocol}//${host}/api.php`;
            } else {
              apiBase = `${url.protocol}//${host}/w/api.php`;
            }

            // Use batch resolution with 800px width for detail view (same method as thumbnails)
            const resolved = await batchResolveTitles(apiBase, [title], isFile, 800);
            const imageUrl = resolved.get(title);
            if (imageUrl) { flagImage.src = imageUrl; return; }

            // commons fallback for File: links
            if (isFile && !/wikimedia\.org$/.test(host)) {
              const fb = await batchResolveTitles('https://commons.wikimedia.org/w/api.php', [title], true, 800);
              const fbUrl = fb.get(title);
              if (fbUrl) { flagImage.src = fbUrl; return; }
            }
          }

          // give up — hide image element
          flagImage.remove();
        })();

        // Description handling
        const idKey = 'link:' + mainHref; // key namespace per-flag by original href
        const all = getSaved();
        const existing = all[idKey];
        descView.textContent = existing || '';

        function startEdit() {
          descEdit.value = existing || '';
          descView.style.display = 'none';
          descEdit.style.display = 'block';
          editToggle.style.display = 'none';
          saveBtn.style.display = 'inline-block';
          resetBtn.style.display = 'inline-block';
        }
        function stopEdit() {
          descView.style.display = 'block';
          descEdit.style.display = 'none';
          editToggle.style.display = 'inline-block';
          saveBtn.style.display = 'none';
          resetBtn.style.display = 'none';
        }

        editToggle.addEventListener('click', () => startEdit());
        saveBtn.addEventListener('click', () => {
          const newText = descEdit.value.trim();
          const a = getSaved();
          if (newText) a[idKey] = newText; else delete a[idKey];
          saveAll(a);
          descView.textContent = newText || '';
          stopEdit();
        });
        resetBtn.addEventListener('click', () => {
          const a = getSaved();
          delete a[idKey];
          saveAll(a);
          descView.textContent = '';
          stopEdit();
        });

        return; // don't render the list when showing detail
      }

      // First pass: render every row (with an empty thumbnail placeholder)
      // and classify its flag link so we know how to resolve it.
      const descriptors = []; // { thumbEl, mainHref }

      rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        if (!cells.length) return;
        const dayText = cells[0].textContent.trim();
        if (!dayText.match(/^Day \d+$/i)) return;

        const mainLink = cells[1]?.querySelector('a');
        if (!mainLink) return;

        const mainHref = mainLink.getAttribute('href');
        const altLink = cells[2]?.querySelector('a');
        const altHref = altLink?.getAttribute('href');

        const div = document.createElement('div');
        div.className = 'row';
        div.dataset.name = mainLink.textContent.toLowerCase();
        div.dataset.day = dayText.toLowerCase();

        // Make the name navigate to THIS page with ?flag=<original-href>
        // so it opens in the same tab and we can show a detail page.
        div.innerHTML = `
          <span class="day">${dayText.replace('Day ', '#')}</span>
          <a href="?flag=${encodeURIComponent(mainHref)}">${mainLink.textContent}</a>
          <img class="flag-thumb" alt="" loading="lazy" />
          ${altHref ? `<span class="alt">— <a href="${altHref}" target="_blank">alt</a></span>` : ''}
        `;

        list.appendChild(div);

        const dayMatch = dayText.match(/^Day (\d+)$/i);
        const dayNum = dayMatch ? parseInt(dayMatch[1], 10) : -1;

        const thumbEl = div.querySelector('.flag-thumb');
        thumbEl.addEventListener('error', () => thumbEl.remove());

        descriptors.push({ thumbEl, mainHref, dayNum });
        count++;
      });

      document.getElementById('count').textContent = `${count} flags. ${count} days.`;

      // Second pass: classify each link and group the MediaWiki ones by
      // (api endpoint, isFile) so each group can be resolved in one batch.
      const groups = new Map(); // key -> { apiBase, isFile, rowsByTitle: Map(title -> descriptor[]) }
      const commonsFallbackTitles = new Map(); // title -> descriptor[]

      for (const d of descriptors) {
        let url;
        try { url = new URL(d.mainHref, location.href); } catch (e) { d.thumbEl.remove(); continue; }

        // Google Drive share links don't need an API call at all.
        if (url.hostname.includes('drive.google.com')) {
          const m = d.mainHref.match(/\/file\/d\/([^/]+)/);
          if (m) {
            d.thumbEl.src = `https://drive.google.com/thumbnail?id=${m[1]}&sz=w60`;
          } else {
            d.thumbEl.remove();
          }
          continue;
        }

        const wikiMatch = d.mainHref.match(/\/wiki\/([^#?]+)/);
        if (wikiMatch) {
          let title = decodeURIComponent(wikiMatch[1]);

          // Some Fandom links point at an article with a `?file=` query
          // param instead of the File: page itself.
          const fileParam = url.searchParams.get('file');
          if (fileParam) title = 'File:' + fileParam;

          const isFile = /^File:/i.test(title);
          const host = url.hostname;

          let apiBase;
          if (/wikimedia\.org$/.test(host) || /wikipedia\.org$/.test(host)) {
            apiBase = `${url.protocol}//${host.replace(/^commons\.m\./, 'commons.')}/w/api.php`;
          } else if (/fandom\.com$/.test(host)) {
            apiBase = `${url.protocol}//${host}/api.php`;
          } else {
            // Rare: some other self-hosted wiki. Best-effort guess.
            apiBase = `${url.protocol}//${host}/w/api.php`;
          }

          const key = apiBase + '|' + (isFile ? 'file' : 'page');
          if (!groups.has(key)) groups.set(key, { apiBase, isFile, rowsByTitle: new Map() });
          const g = groups.get(key);
          if (!g.rowsByTitle.has(title)) g.rowsByTitle.set(title, []);
          g.rowsByTitle.get(title).push(d);

          // Flags are often uploaded straight to Commons even when linked
          // from a different wiki — queue a Commons fallback for File: links.
          if (isFile && !/wikimedia\.org$/.test(host)) {
            if (!commonsFallbackTitles.has(title)) commonsFallbackTitles.set(title, []);
            commonsFallbackTitles.get(title).push(d);
          }
          continue;
        }

        // The link itself points straight at an image file.
        if (/\.(png|jpe?g|gif|svg|webp)$/i.test(url.pathname)) {
          d.thumbEl.src = d.mainHref;
          continue;
        }

        d.thumbEl.remove();
      }

      // Resolve every group concurrently, each as a small number of batched
      // requests instead of one request per row.
      await Promise.all([...groups.values()].map(async g => {
        const titles = [...g.rowsByTitle.keys()];
        const resolved = await batchResolveTitles(g.apiBase, titles, g.isFile, 60);
        for (const [title, descs] of g.rowsByTitle) {
          const url = resolved.get(title);
          if (url) {
            descs.forEach(d => { d.thumbEl.src = url; d.resolved = true; });
          }
        }
      }));

      // Fallback pass: retry any still-unresolved File: links against Commons.
      const stillUnresolved = [...commonsFallbackTitles.keys()].filter(title =>
        commonsFallbackTitles.get(title).some(d => !d.resolved)
      );
      if (stillUnresolved.length) {
        const fb = await batchResolveTitles('https://commons.wikimedia.org/w/api.php', stillUnresolved, true, 60);
        stillUnresolved.forEach(title => {
          const url = fb.get(title);
          if (!url) return;
          commonsFallbackTitles.get(title).forEach(d => {
            if (!d.resolved) { d.thumbEl.src = url; d.resolved = true; }
          });
        });
      }

      // Clean up any rows that never got resolved.
      descriptors.forEach(d => { if (!d.thumbEl.src) d.thumbEl.remove(); });

      // Favicon = the flag with the highest day number that actually
      // resolved to an image (not just whichever happened to finish last).
      const resolvedDescriptors = descriptors.filter(d => d.thumbEl.src);
      if (resolvedDescriptors.length) {
        const latest = resolvedDescriptors.reduce((max, d) => (d.dayNum > max.dayNum ? d : max), resolvedDescriptors[0]);
        const link = document.createElement('link');
        link.rel = 'icon';
        link.href = latest.thumbEl.src;
        document.head.appendChild(link);
      }

      document.getElementById('search').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        document.querySelectorAll('.row').forEach(row => {
          row.classList.toggle('hidden', q && !row.dataset.name.includes(q) && !row.dataset.day.includes(q));
        });
      });
    })();

    // tiny helper to prevent injection when inserting into attributes/HTML
    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }
  </script>
</body>
</html>
