<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>flag detail</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color:#111 }
    .controls { margin-bottom: 12px }
    .btn { padding: .4rem .7rem; margin-right: .4rem; cursor: pointer }
    .flag-large { width: 100%; max-height: 60vh; object-fit: contain; border: 1px solid #eee; background: #fff }
    .desc { margin-top: 12px }
    .edit-area { width: 100%; min-height: 120px; font-size: 1rem; padding: .5rem; box-sizing: border-box }
    .small { font-size: .9rem; color: #666; margin-top: .5rem }
  </style>
</head>
<body>
  <div class="controls">
    <button id="backBtn" class="btn">◀ Back</button>
    <button id="editToggle" class="btn">Edit description</button>
    <button id="saveBtn" class="btn" style="display:none">Save</button>
    <button id="resetBtn" class="btn" style="display:none">Reset</button>
  </div>

  <main class="detail">
    <h2 id="title"><a id="titleLink" href="#" target="_blank" rel="noopener"></a></h2>
    <div><img id="flagImage" class="flag-large" alt="flag" /></div>
    <div class="desc">
      <div id="descView"></div>
      <textarea id="descEdit" class="edit-area" style="display:none"></textarea>
      <div class="small">Title opens the source in a new tab. Your edits are saved locally to this browser (localStorage).</div>
    </div>
    <div style="margin-top:12px;" class="alt" id="altLinkArea"></div>
  </main>

<script>
// copied helper from index.html
async function fetchWithRetry(url, retries = 2, delayMs = 400) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await fetch(url);
      if (res.ok) return res;
    } catch (e) {}
    if (attempt < retries) await new Promise(r => setTimeout(r, delayMs * (attempt + 1)));
  }
  return null;
}

function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

(async function(){
  const flagParam = new URLSearchParams(location.search).get('flag');
  if (!flagParam) {
    document.body.innerHTML = '<p>No flag specified. Open from the list or pass ?flag=&lt;originalHref&gt;.</p><p><a href="index.html">Back to list</a></p>';
    return;
  }
  const mainHref = decodeURIComponent(flagParam);

  const titleLink = document.getElementById('titleLink');
  titleLink.textContent = mainHref;
  try { titleLink.href = new URL(mainHref, location.href).href; } catch (e) { titleLink.href = mainHref; }

  const flagImage = document.getElementById('flagImage');
  const descView = document.getElementById('descView');
  const descEdit = document.getElementById('descEdit');
  const editToggle = document.getElementById('editToggle');
  const saveBtn = document.getElementById('saveBtn');
  const resetBtn = document.getElementById('resetBtn');
  const altLinkArea = document.getElementById('altLinkArea');

  const STORAGE_KEY = 'fotd_descriptions_v1';
  function getSaved(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e){ return {}; } }
  function saveAll(obj){ localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); }

  // resolve image similar to index.html
  (async function resolveImage(){
    try {
      const u = new URL(mainHref, location.href);
      if (/\.(png|jpe?g|gif|svg|webp)$/i.test(u.pathname)){
        flagImage.src = u.href; return;
      }
    } catch(e){}

    const wikiMatch = mainHref.match(/\/wiki\/([^#?]+)/);
    if (wikiMatch){
      let title = decodeURIComponent(wikiMatch[1]);
      const url = new URL(mainHref, location.href);
      const fileParam = url.searchParams.get('file');
      if (fileParam) title = 'File:' + fileParam;
      const isFile = /^File:/i.test(title);
      const host = url.hostname;
      let apiBase;
      if (/wikimedia\.org$/.test(host) || /wikipedia\.org$/.test(host)) {
        apiBase = `${url.protocol}//${host.replace(/^commons\.m\./, 'commons.')}/w/api.php`;
      } else if (/fandom\.com$/.test(host)) {
        apiBase = `${url.protocol}//${host}/api.php`;
      } else {
        apiBase = `${url.protocol}//${host}/w/api.php`;
      }

      // single-title resolution
      const width = 800;
      const params = isFile
        ? `action=query&prop=imageinfo&iiprop=url&iiurlwidth=${width}&titles=${encodeURIComponent(title)}&format=json&origin=*`
        : `action=query&prop=pageimages&piprop=thumbnail&pithumbsize=${width}&titles=${encodeURIComponent(title)}&format=json&origin=*`;
      const endpoint = `${apiBase}?${params}`;
      const res = await fetchWithRetry(endpoint);
      if (res){
        try {
          const data = await res.json();
          const q = data.query || {};
          for (const pid in (q.pages || {})){
            const page = q.pages[pid];
            if (page.missing !== undefined) continue;
            if (isFile){
              const info = page.imageinfo && page.imageinfo[0];
              if (info && (info.thumburl || info.url)){ flagImage.src = info.thumburl || info.url; return; }
            } else {
              if (page.thumbnail && page.thumbnail.source){ flagImage.src = page.thumbnail.source; return; }
            }
          }
        } catch(e){}
      }

      // commons fallback
      if (isFile && !/wikimedia\.org$/.test(host)){
        const fbRes = await fetchWithRetry('https://commons.wikimedia.org/w/api.php?action=query&prop=imageinfo&iiprop=url&iiurlwidth=' + width + '&titles=' + encodeURIComponent(title) + '&format=json&origin=*');
        if (fbRes){
          try{
            const fb = await fbRes.json();
            for (const pid in (fb.query?.pages || {})){
              const page = fb.query.pages[pid];
              const info = page.imageinfo && page.imageinfo[0];
              if (info && (info.thumburl || info.url)){ flagImage.src = info.thumburl || info.url; return; }
            }
          } catch(e){}
        }
      }
    }

    // not found — hide image
    flagImage.remove();
  })();

  // load/save desc
  const idKey = 'link:' + mainHref;
  const all = getSaved();
  const existing = all[idKey];
  descView.textContent = existing || '';

  function startEdit(){ descEdit.value = existing || ''; descView.style.display='none'; descEdit.style.display='block'; editToggle.style.display='none'; saveBtn.style.display='inline-block'; resetBtn.style.display='inline-block'; }
  function stopEdit(){ descView.style.display='block'; descEdit.style.display='none'; editToggle.style.display='inline-block'; saveBtn.style.display='none'; resetBtn.style.display='none'; }

  editToggle.addEventListener('click', ()=>startEdit());
  saveBtn.addEventListener('click', ()=>{ const newText = descEdit.value.trim(); const a = getSaved(); if (newText) a[idKey] = newText; else delete a[idKey]; saveAll(a); descView.textContent = newText || ''; stopEdit(); });
  resetBtn.addEventListener('click', ()=>{ const a = getSaved(); delete a[idKey]; saveAll(a); descView.textContent=''; stopEdit(); });

  document.getElementById('backBtn').addEventListener('click', ()=>{ if (history.length>1) history.back(); else location.href = 'index.html'; });

  // if the original link had an alt link, show placeholder (user can open source)
  try{
    const url = new URL(mainHref, location.href);
    const alt = ''; // no alt known here
    if (alt) altLinkArea.innerHTML = 'Alt: <a href="'+escapeHtml(alt)+'" target="_blank" rel="noopener">alt link</a>';
  } catch(e){}

})();
</script>
</body>
</html>
